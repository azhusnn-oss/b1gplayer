name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships the Android SDK, so it only needs
      # its licences accepted. The setup-android action is not used: it calls
      # `sdkmanager tools`, a package Google has removed.
      - name: Accept Android SDK licences
        run: |
          sdkmanager=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug

      # Proves the APK is installable before anyone downloads it: an unsigned or
      # truncated package is what Android reports as "problem parsing the package".
      - name: Verify the APK
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $apk"
          ls -l "$apk"
          sha256sum "$apk"

          buildtools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $buildtools"

          "$buildtools/aapt2" dump badging "$apk" | head -5
          "$buildtools/apksigner" verify --verbose --print-certs "$apk"

      # The downloadable build, for anyone without a local Android toolchain.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: b1gplayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
